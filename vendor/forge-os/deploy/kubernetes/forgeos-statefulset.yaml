apiVersion: v1
kind: Service
metadata:
  name: forgeos
spec:
  selector: { app: forgeos }
  ports:
    - name: http
      port: 8787
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgeos
spec:
  serviceName: forgeos
  replicas: 1
  selector:
    matchLabels: { app: forgeos }
  template:
    metadata:
      labels: { app: forgeos }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: forgeos
          image: ghcr.io/your-org/forge-os:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8787 }
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: FORGEOS_PORT, value: "8787" }
            - { name: FORGEOS_STORAGE_BACKEND, value: "sqlite" }
            - { name: FORGEOS_DATA_DIR, value: "/var/lib/forgeos" }
            - { name: FORGEOS_API_KEY_FILE, value: "/run/secrets/forgeos/api-key" }
            - name: FORGEOS_PUBLIC_BASE_URL
              valueFrom: { configMapKeyRef: { name: forgeos-config, key: publicBaseUrl } }
            - name: FORGEOS_ALLOWED_ORIGINS
              valueFrom: { configMapKeyRef: { name: forgeos-config, key: allowedOrigins } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/forgeos }
            - { name: api-key, mountPath: /run/secrets/forgeos, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: api-key
          secret:
            secretName: forgeos-api-key
            defaultMode: 0400
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 10Gi }
