name: Bug report
description: Report reproducible behavior that violates a ForgeOS contract
title: "[bug]: "
labels: [bug, triage]
body:
  - type: textarea
    id: behavior
    attributes: { label: Observed behavior, description: Include exact command and output. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected contract }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Minimal reproduction }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: ForgeOS version }
    validations: { required: true }
