name: Product Perfection Task 10 Cycle B Visual Reobserve

on:
  push:
    branches: [codex/product-perfection-system-v3]
    paths:
      - '.github/workflows/product-perfection-task10-cycle-b-visual-reobserve.yml'

permissions:
  contents: read

jobs:
  reobserve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NOLANE_AGENT_HOST: 127.0.0.1
      NOLANE_AGENT_PORT: 4173
      NOLANE_AGENT_TOKEN: nolane-task10-cycle-b-reobserve-token
      NOLANE_UI_RUNTIME_URL: http://127.0.0.1:4173
      NOLANE_UI_EVIDENCE_REVISION: ac4492ed3c3e892febcad55b63e1f2155c2953c0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ac4492ed3c3e892febcad55b63e1f2155c2953c0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npm run build:ui-v3
          git diff --exit-code -- ui-dist
          npm install --no-save --ignore-scripts playwright@1.58.2 @axe-core/playwright@4.12.1
          npx playwright install --with-deps chromium
      - name: Start exact source runtime
        env:
          NOLANE_AGENT_DATA_DIR: ${{ runner.temp }}/cycle-b-reobserve-data
        run: |
          set -euo pipefail
          node src/app.mjs > "$RUNNER_TEMP/cycle-b-reobserve.log" 2>&1 &
          echo "PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$NOLANE_UI_RUNTIME_URL/health" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/cycle-b-reobserve.log"
          exit 1
      - name: Complete onboarding
        env:
          NOLANE_UI_VISUAL_OUTPUT: ${{ runner.temp }}/cycle-b-reobserve/bootstrap
          NOLANE_UI_VISUAL_STATES: onboarding
        run: node scripts/capture-ui-runtime-visual.mjs
      - name: Capture visible saved and dirty toolbar states
        run: |
          cat > "$RUNNER_TEMP/cycle-b-reobserve.mjs" <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import AxeBuilder from '@axe-core/playwright';
          import { chromium } from 'playwright';
          const base = process.env.NOLANE_UI_RUNTIME_URL;
          const token = process.env.NOLANE_AGENT_TOKEN;
          const output = path.join(process.env.RUNNER_TEMP, 'cycle-b-reobserve', 'material');
          await mkdir(output, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 640, height: 1000 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          const captures = [];
          const inspectAndCapture = async (state, filename) => {
            const button = page.locator('[data-settings-action="save"]');
            await button.waitFor({ state: 'visible', timeout: 20_000 });
            await page.locator('.settings-toolbar').scrollIntoViewIfNeeded();
            await page.evaluate(() => { const c=document.querySelector('[data-scroll-key="settings-content"]'); if(c) c.scrollTop=0; window.scrollTo(0,0); });
            await page.waitForTimeout(100);
            const material = await button.evaluate((node) => { const c=getComputedStyle(node); const r=node.getBoundingClientRect(); return { saveState:node.dataset.settingsSaveState, disabled:node.disabled, primary:node.classList.contains('primary'), backgroundColor:c.backgroundColor, color:c.color, borderColor:c.borderColor, opacity:Number(c.opacity), label:node.textContent?.trim()??'', rect:{left:r.left,top:r.top,right:r.right,bottom:r.bottom}, inViewport:r.left>=0&&r.top>=0&&r.right<=innerWidth&&r.bottom<=innerHeight }; });
            if(material.saveState!==state||!material.inViewport) throw new Error('toolbar material state not visibly framed: '+JSON.stringify(material));
            const axe=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']).analyze();
            const blocking=axe.violations.filter((v)=>['serious','critical'].includes(String(v.impact)));
            if(blocking.length) throw new Error(state+' Axe blockers: '+blocking.map((v)=>v.id).join(','));
            const file=path.join(output,filename); await page.screenshot({path:file,fullPage:false,animations:'disabled'}); const bytes=await readFile(file);
            captures.push({state,file:filename,sha256:createHash('sha256').update(bytes).digest('hex'),material,axeSeriousCritical:'PASS'});
            return material;
          };
          try {
            await page.goto(`${base}/#/settings?token=${encodeURIComponent(token)}`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('.settings-center').waitFor({state:'visible',timeout:30000});
            await page.evaluate(async ({token})=>{const r=await fetch('/api/settings',{method:'PUT',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({layer:'user',patch:{appearance:{theme:'nocturne'}}})}); if(!r.ok) throw new Error('theme patch '+r.status);},{token});
            await page.reload({waitUntil:'domcontentloaded'}); await page.locator('.settings-center').waitFor({state:'visible'});
            const saved=await inspectAndCapture('saved','settings-saved-toolbar-nocturne-640.png');
            if(!saved.disabled||saved.primary) throw new Error('saved hierarchy mismatch '+JSON.stringify(saved));
            await page.locator('[data-settings-category-link="appearance"]').click();
            await page.locator('[data-settings-category="appearance"]').waitFor({state:'visible'});
            const next=page.locator('[data-setting-choice][data-setting-path="appearance.accent"][aria-pressed="false"]').first(); await next.click();
            await page.waitForFunction(()=>document.querySelector('[data-settings-action="save"]')?.dataset?.settingsSaveState==='dirty');
            const dirty=await inspectAndCapture('dirty','settings-dirty-toolbar-nocturne-640.png');
            if(dirty.disabled||!dirty.primary||dirty.backgroundColor===saved.backgroundColor||dirty.opacity<=saved.opacity) throw new Error('dirty hierarchy mismatch '+JSON.stringify({saved,dirty}));
          } finally { await context.close(); await browser.close(); }
          const report={schema:'nolane.task10.cycle-b-visual-reobserve.v1',revision:process.env.NOLANE_UI_EVIDENCE_REVISION,captures}; report.receiptSha256=createHash('sha256').update(JSON.stringify(report)).digest('hex'); await writeFile(path.join(output,'receipt.json'),JSON.stringify(report,null,2)+'\n'); console.log(JSON.stringify(report));
          NODE
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/node_modules"
          node "$RUNNER_TEMP/cycle-b-reobserve.mjs"
      - uses: actions/upload-artifact@v6
        with:
          name: product-perfection-task10-cycle-b-visual-reobserve
          path: ${{ runner.temp }}/cycle-b-reobserve
          if-no-files-found: error
          retention-days: 21
      - name: Stop runtime
        if: always()
        run: |
          if [ -n "${PID:-}" ]; then kill "$PID" || true; fi
