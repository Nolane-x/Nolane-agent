name: Materialize 0.0.0 native icons

on:
  push:
    branches: [codex/0.0.0-baseline]
    paths: [.github/workflows/icon-sync-0.0.0.yml]

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/0.0.0-baseline
          fetch-depth: 0
      - name: Render platform icon assets with runner image tools
        shell: bash
        run: |
          set -euo pipefail
          command -v convert
          command -v identify
          mkdir -p build
          convert -background none ui/nolane-mark.svg -resize 512x512 -strip -define png:compression-level=9 build/icon.png
          convert build/icon.png -define icon:auto-resize=256,64,32,16 build/icon.ico
          test "$(identify -format '%wx%h' build/icon.png)" = "512x512"
      - name: Commit binary assets only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nolane-x"
          git config user.email "278117157+Nolane-x@users.noreply.github.com"
          git add build/icon.png build/icon.ico
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "feat(branding): add native application icons"
          git push origin HEAD:codex/0.0.0-baseline
