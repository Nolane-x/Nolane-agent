name: Sync UI distribution maintenance

on:
  pull_request:
    types: [reopened]
    paths:
      - '.github/workflows/sync-ui-dist-maintenance.yml'
      - 'ui-v3/**'

permissions:
  contents: write

concurrency:
  group: sync-ui-dist-maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-ui-dist:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/ui-performance-runtime-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build deterministic UI distribution
        run: npm run build:ui-v3

      - name: Prove build changed only generated UI distribution
        shell: bash
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v '^ui-dist/' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' 'Unexpected generated changes:' "$unexpected" >&2
            exit 1
          fi
          test -n "$(git status --porcelain -- ui-dist)" || { echo 'ui-dist already synchronized'; exit 0; }

      - name: Commit synchronized distribution
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- ui-dist)" ]; then
            exit 0
          fi
          git config user.name 'nolane-ci'
          git config user.email 'nolane-ci@users.noreply.github.com'
          git add --all ui-dist
          git commit -m 'build(ui): sync committed distribution'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
