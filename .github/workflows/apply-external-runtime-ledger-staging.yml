name: Apply external runtime ledger staging patch

on:
  push:
    branches:
      - codex/external-runtime-ledger-staging

permissions:
  contents: write

concurrency:
  group: external-runtime-ledger-staging
  cancel-in-progress: false

jobs:
  apply-ledger-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply fail-closed ledger ingestion patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .ci/external-runtime-ledger.patch
          git apply .ci/external-runtime-ledger.patch
          node --test tests/master-acceptance-ledger.test.mjs tests/external-gate-certification.test.mjs tests/external-gate-certification-builder.test.mjs

      - name: Commit clean staging tree
        shell: bash
        run: |
          set -euo pipefail
          rm .ci/external-runtime-ledger.patch .github/workflows/apply-external-runtime-ledger-staging.yml
          git add src/requirements/master-ledger.mjs scripts/generate-master-acceptance-ledger.mjs tests/master-acceptance-ledger.test.mjs .ci/external-runtime-ledger.patch .github/workflows/apply-external-runtime-ledger-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(evidence): consume bounded external runtime certification'
          git push origin HEAD:codex/external-runtime-ledger-staging
