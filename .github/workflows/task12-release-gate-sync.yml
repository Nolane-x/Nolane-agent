name: Task 12 release gate source sync

on:
  push:
    branches:
      - codex/product-perfection-system-v3

permissions:
  contents: write

concurrency:
  group: task12-release-gate-source-sync
  cancel-in-progress: true

jobs:
  wire-release-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Wire package and release workflow
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts['verify:release-candidate'] = 'node scripts/verify-release-candidate.mjs';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const releasePath = '.github/workflows/release.yml';
          let source = fs.readFileSync(releasePath, 'utf8');
          if (!source.includes('  actions: read\n')) {
            source = source.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: write\n  actions: read\n');
          }
          if (!source.includes('  candidate-gate:\n')) {
            const marker = 'jobs:\n  macos-release:\n';
            const candidate = `jobs:\n  candidate-gate:\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    steps:\n      - uses: actions/checkout@v6\n        with:\n          ref: \${{ env.RELEASE_TAG }}\n          fetch-depth: 0\n\n      - uses: actions/setup-node@v7\n        with:\n          node-version: '24'\n          cache: npm\n\n      - name: Verify immutable tag and commit\n        env:\n          GITHUB_SHA: \${{ github.sha }}\n        run: node scripts/verify-release-tag.mjs\n\n      - name: Install locked source dependencies\n        run: npm ci --ignore-scripts\n\n      - name: Collect exact-head workflow evidence\n        env:\n          GH_TOKEN: \${{ github.token }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          gh api \"repos/\${GITHUB_REPOSITORY}/actions/runs?head_sha=\${GITHUB_SHA}&per_page=100\" > \"$RUNNER_TEMP/exact-head-workflows.json\"\n          external_run_id=$(node --input-type=module -e \"import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const run=(p.workflow_runs||[]).filter(r=>r.name==='External gate evidence'&&r.head_sha===process.env.GITHUB_SHA&&r.status==='completed'&&r.conclusion==='success').sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at))[0]; if(!run) process.exit(2); process.stdout.write(String(run.id));\" \"$RUNNER_TEMP/exact-head-workflows.json\")\n          mkdir -p \"$RUNNER_TEMP/external-certification\"\n          gh run download \"$external_run_id\" --repo \"$GITHUB_REPOSITORY\" --name external-gate-certification-candidate --dir \"$RUNNER_TEMP/external-certification\"\n\n      - name: Verify exact-head release candidate\n        shell: bash\n        run: |\n          set -euo pipefail\n          certification=$(find \"$RUNNER_TEMP/external-certification\" -type f -name '*.json' -print -quit)\n          test -n \"$certification\"\n          npm run verify:release-candidate -- \\\n            --expected-sha \"$GITHUB_SHA\" \\\n            --tag-sha \"$GITHUB_SHA\" \\\n            --workflow-runs \"$RUNNER_TEMP/exact-head-workflows.json\" \\\n            --external-certification \"$certification\" \\\n            --output release/release-candidate-gate.json\n\n      - name: Upload candidate gate receipt\n        if: always()\n        uses: actions/upload-artifact@v6\n        with:\n          name: nolane-release-candidate-gate\n          path: release/release-candidate-gate.json\n          if-no-files-found: warn\n          retention-days: 30\n\n  macos-release:\n    needs: candidate-gate\n`;
            if (!source.includes(marker)) throw new Error('release workflow macos marker not found');
            source = source.replace(marker, candidate);
          } else if (!source.includes('  macos-release:\n    needs: candidate-gate\n')) {
            source = source.replace('  macos-release:\n', '  macos-release:\n    needs: candidate-gate\n');
          }
          if (!source.includes('  linux-release:\n    needs: candidate-gate\n')) {
            source = source.replace('  linux-release:\n', '  linux-release:\n    needs: candidate-gate\n');
          }
          fs.writeFileSync(releasePath, source);
          NODE
      - name: Verify release gate contracts before commit
        run: node --test tests/release-candidate-gate.test.mjs tests/github-release-workflow.test.mjs
      - name: Commit wired release gate
        shell: bash
        run: |
          set -euo pipefail
          git add package.json .github/workflows/release.yml
          if git diff --cached --quiet; then
            echo 'Release gate source already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(release): gate packaging on exact-head evidence'
          git push origin HEAD:${GITHUB_REF_NAME}
