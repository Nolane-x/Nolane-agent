name: UI responsive pressure build

on:
  push:
    branches:
      - codex/ui-runtime-certification-evidence
    paths:
      - '.github/workflows/ui-responsive-pressure-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    if: github.ref == 'refs/heads/codex/ui-runtime-certification-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Prove responsive and accessibility regressions
        run: node --test tests/ui-responsive-medium-pressure.test.mjs tests/ui-v3-control-plane-scroll-region.test.mjs tests/ui-v3-settings-contrast.test.mjs tests/ui-v3-skills-contrast.test.mjs
      - name: Build deterministic UI distribution
        run: npm run build:ui-v3
      - name: Commit generated UI distribution
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-dist
          if git diff --cached --quiet; then
            echo 'ui-dist already matches ui-v3'
            exit 0
          fi
          git commit -m 'build(ui): refresh responsive distribution'
          git push origin HEAD:codex/ui-runtime-certification-evidence
