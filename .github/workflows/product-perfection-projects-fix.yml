name: Product Perfection Projects Shell-Grid Repair

on:
  push:
    branches:
      - codex/product-perfection-system-v3

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Write regression test and prove RED
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/ui-v3-app-main-grid.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const css = await readFile(new URL('../ui-v3/styles/layout/app-shell.css', import.meta.url), 'utf8');

          test('app-main reserves an auto row for update notice before flexible workspace', () => {
            assert.match(css, /\.app-main\{[^}]*grid-template-rows:var\(--topbar-height\) auto minmax\(0,1fr\)/);
          });

          test('settings shell reserves an auto update row before its flexible workspace', () => {
            assert.match(css, /\.app-shell\[data-shell-mode="settings"\]>\.app-main\{[^}]*grid-template-rows:auto minmax\(0,1fr\)/);
          });
          EOF
          if node --test tests/ui-v3-app-main-grid.test.mjs; then
            echo 'Expected RED before shell-grid correction, but test passed' >&2
            exit 1
          fi

      - name: Apply causal shell-grid correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('ui-v3/styles/layout/app-shell.css')
          s = p.read_text()
          old_main = 'grid-template-rows:var(--topbar-height) minmax(0,1fr);background:transparent}.app-topbar'
          new_main = 'grid-template-rows:var(--topbar-height) auto minmax(0,1fr);background:transparent}.app-topbar'
          old_settings = '.app-shell[data-shell-mode="settings"]>.app-main{grid-column:1;grid-template-rows:minmax(0,1fr)}'
          new_settings = '.app-shell[data-shell-mode="settings"]>.app-main{grid-column:1;grid-template-rows:auto minmax(0,1fr)}'
          if s.count(old_main) != 1: raise SystemExit('unexpected app-main grid authority shape')
          if s.count(old_settings) != 1: raise SystemExit('unexpected settings grid authority shape')
          p.write_text(s.replace(old_main, new_main).replace(old_settings, new_settings))
          PY

      - name: Prove GREEN and build canonical UI distribution
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/ui-v3-app-main-grid.test.mjs tests/ui-v3-project-layout-diagnostics.test.mjs tests/ui-v3-shell.test.mjs
          npm run build:ui-v3
          git diff --check

      - name: Scope guard and commit repair
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
          for file in "${changed[@]}"; do
            case "$file" in
              ui-v3/styles/layout/app-shell.css|tests/ui-v3-app-main-grid.test.mjs|ui-dist/*) ;;
              *) echo "unexpected repair change: $file" >&2; exit 1 ;;
            esac
          done
          git add ui-v3/styles/layout/app-shell.css tests/ui-v3-app-main-grid.test.mjs ui-dist
          git config user.name 'nolane-evidence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(ui): reserve update row before workspace'
          git push origin HEAD:codex/product-perfection-system-v3
