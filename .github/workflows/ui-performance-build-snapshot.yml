name: UI performance build snapshot

on:
  push:
    branches:
      - codex/ui-performance-runtime-evidence
      - checkpoint/ui-performance-evidence-20260815
    paths:
      - '.github/workflows/ui-performance-build-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build-snapshot:
    if: github.ref_name == 'codex/ui-performance-runtime-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Prove merged responsive, Skills, and performance contracts
        run: >-
          node --test
          tests/ui-v3-skills-progressive-render.test.mjs
          tests/ui-v3-skills-library.test.mjs
          tests/ui-v3-skills-contrast.test.mjs
          tests/ui-responsive-medium-pressure.test.mjs
          tests/ui-v3-control-plane-scroll-region.test.mjs
          tests/ui-v3-settings-contrast.test.mjs
          tests/ui-performance-runtime-evidence.test.mjs
      - name: Build deterministic UI distribution
        run: npm run build:ui-v3
      - name: Upload generated UI distribution snapshot
        uses: actions/upload-artifact@v6
        with:
          name: ui-performance-merged-dist-${{ github.sha }}
          path: ui-dist
          if-no-files-found: error
          retention-days: 3

  package-checkpoint:
    if: github.ref_name == 'checkpoint/ui-performance-evidence-20260815'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Archive exact verified source SHA
        shell: bash
        run: |
          set -euo pipefail
          target_sha='5169bf18be62b6a78aa4ba2ad9d6a3c37270c7cd'
          out="$RUNNER_TEMP/nolane-ui-performance-checkpoint"
          mkdir -p "$out"
          git cat-file -e "$target_sha^{commit}"
          git archive --format=zip --prefix='Nolane-agent-ui-performance-5169bf1/' \
            --output="$out/Nolane-agent-ui-performance-5169bf1-source.zip" \
            "$target_sha"
          cat > "$out/checkpoint-manifest.json" <<JSON
          {
            "schema": "nolane.agent.checkpoint-package.v1",
            "repository": "Nolane-x/Nolane-agent",
            "sourceSha": "$target_sha",
            "sourceBranch": "codex/ui-performance-runtime-evidence",
            "ciRun": 31856366247,
            "visualRun": 31856366262,
            "performanceRun": 31856366260,
            "externalGateRun": 31856366249,
            "windows8GbCertified": false,
            "screenReaderCertified": false,
            "performanceCertified": false
          }
          JSON
          shasum -a 256 "$out/Nolane-agent-ui-performance-5169bf1-source.zip" > "$out/SHA256SUMS.txt"
      - name: Upload exact source checkpoint
        uses: actions/upload-artifact@v6
        with:
          name: nolane-ui-performance-checkpoint-source-registered
          path: ${{ runner.temp }}/nolane-ui-performance-checkpoint
          if-no-files-found: error
          retention-days: 30
