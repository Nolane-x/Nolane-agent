name: UI performance build snapshot

on:
  push:
    branches:
      - codex/ui-performance-runtime-evidence
    paths:
      - '.github/workflows/ui-performance-build-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Prove merged responsive, Skills, and performance contracts
        run: >-
          node --test
          tests/ui-v3-skills-progressive-render.test.mjs
          tests/ui-v3-skills-library.test.mjs
          tests/ui-v3-skills-contrast.test.mjs
          tests/ui-responsive-medium-pressure.test.mjs
          tests/ui-v3-control-plane-scroll-region.test.mjs
          tests/ui-v3-settings-contrast.test.mjs
          tests/ui-performance-runtime-evidence.test.mjs
      - name: Build deterministic UI distribution
        run: npm run build:ui-v3
      - name: Upload generated UI distribution snapshot
        uses: actions/upload-artifact@v6
        with:
          name: ui-performance-merged-dist-${{ github.sha }}
          path: ui-dist
          if-no-files-found: error
          retention-days: 3
