name: Release

on:
  push:
    tags:
      - 'v0.0.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NOLANE_GITHUB_REPOSITORY: Nolane-x/Nolane-agent
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts
      - id: identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}"
          [[ "${GITHUB_REF_NAME}" =~ ^v0\.0\.[0-9]+$ ]]
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: npm run verify:version
      - run: npm run test:release
      - run: npm run test:core
      - run: npm run verify:electron-installer

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: windows
          - os: macos-latest
            target: mac
            artifact: macos
          - os: ubuntu-latest
            target: linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24.x' }
      - run: npm ci --ignore-scripts
      - name: Build native PTY helper
        shell: bash
        run: |
          set -euo pipefail
          cd native/pty
          if [ "${{ runner.os }}" = "Windows" ]; then go build -trimpath -o NolanePty.exe .; else go build -trimpath -o NolanePty .; fi
      - name: Install pinned Electron builder
        run: npm install --no-save --package-lock=false electron-builder@26.15.3
      - name: Build desktop packages
        env:
          NOLANE_ELECTRON_TARGET: ${{ matrix.target }}
        run: npm run build:electron:installer
      - name: Attest desktop assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/installer/NolaneAgent-*'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: release/installer/NolaneAgent-*
          if-no-files-found: error

  source-and-extension:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts
      - run: npm run build:vscode
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.validate.outputs.version }}'
          mkdir -p release/source
          git archive --format=zip --prefix="NolaneAgent-${version}/" -o "release/source/NolaneAgent-${version}-source.zip" HEAD
          find extensions/vscode -maxdepth 3 -name '*.vsix' -exec cp {} release/source/ \;
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/source/*'
      - uses: actions/upload-artifact@v4
        with:
          name: source-and-extension
          path: release/source/*
          if-no-files-found: error

  publish:
    needs: [validate, desktop, source-and-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with:
          pattern: 'desktop-*'
          path: release/final
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-and-extension
          path: release/final
      - name: Build release manifest and SHA256SUMS
        run: node scripts/create-release-manifest.mjs --dir release/final --version '${{ needs.validate.outputs.version }}' --tag '${{ github.ref_name }}' --commit '${{ github.sha }}'
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.validate.outputs.version }}'
          gh release create "${GITHUB_REF_NAME}" release/final/* --verify-tag --title "Nolane Agent ${version}" --notes-file CHANGELOG.md
