name: Product Perfection Canonical Sync

on:
  push:
    branches:
      - codex/product-perfection-system-v3

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate and verify canonical matrix
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/product-perfection-catalog.test.mjs tests/product-perfection-matrix.test.mjs
          npm run generate:product-perfection-catalog
          npm run generate:product-perfection-matrix
          npm run verify:product-perfection
          git diff --check

      - name: Scope guard and commit generated authority
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
          for file in "${changed[@]}"; do
            case "$file" in
              requirements/product-perfection-catalog.json|requirements/product-perfection-matrix.json) ;;
              *) echo "unexpected generated change: $file" >&2; exit 1 ;;
            esac
          done
          git add requirements/product-perfection-catalog.json requirements/product-perfection-matrix.json
          if git diff --cached --quiet; then
            echo "canonical product-perfection JSON already synchronized"
            exit 0
          fi
          git config user.name "nolane-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(perfection): sync canonical catalog and matrix [skip ci]"
          git push origin HEAD:codex/product-perfection-system-v3
