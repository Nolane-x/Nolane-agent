name: UI breakpoint contrast build

on:
  push:
    branches:
      - codex/ui-runtime-certification-evidence
    paths:
      - '.github/workflows/ui-breakpoint-contrast-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Prove breakpoint contrast regressions
        run: node --test tests/ui-v3-skills-contrast.test.mjs tests/ui-responsive-medium-pressure.test.mjs tests/ui-v3-control-plane-scroll-region.test.mjs tests/ui-v3-settings-contrast.test.mjs
      - name: Build deterministic UI distribution
        run: npm run build:ui-v3
      - name: Commit generated UI distribution
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-dist
          git diff --cached --exit-code && { echo 'Expected generated UI changes were not produced'; exit 1; }
          git commit -m 'build(ui): refresh breakpoint evidence distribution'
          git push origin HEAD:codex/ui-runtime-certification-evidence
