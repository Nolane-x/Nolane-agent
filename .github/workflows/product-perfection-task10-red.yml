name: Product Perfection Task 10 RED

on:
  push:
    branches: [codex/product-perfection-system-v3]
    paths:
      - 'tests/ui-runtime-product-perfection-matrix.test.mjs'
      - '.github/workflows/product-perfection-task10-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Task 10 contract must be RED before implementation
        run: node --test tests/ui-runtime-product-perfection-matrix.test.mjs
