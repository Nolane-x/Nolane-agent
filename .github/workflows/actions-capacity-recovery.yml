name: Actions Capacity Recovery

on:
  push:
    branches: [ops/actions-capacity-recovery]

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: nolane-actions-capacity-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Cancel stale PR workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = 14;
            const activeStatuses = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const keepSha = pr.head.sha;
            const keepBranch = pr.head.ref;
            core.info(`Preserving PR #${pullNumber} head ${keepSha} (${keepBranch})`);

            const targets = [];
            for (const workflow_id of ['security.yml', 'ci.yml']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                per_page: 100,
              });
              for (const run of data.workflow_runs) {
                if (run.head_branch !== keepBranch) continue;
                if (run.head_sha === keepSha) continue;
                if (!activeStatuses.has(run.status)) continue;
                targets.push({ id: run.id, name: run.name, status: run.status, sha: run.head_sha });
              }
            }

            core.info(`Found ${targets.length} stale active run(s)`);
            for (const run of targets) {
              core.info(`Cancel ${run.name} #${run.id} status=${run.status} sha=${run.sha}`);
              try {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/cancel', {
                  owner,
                  repo,
                  run_id: run.id,
                });
              } catch (error) {
                if (error.status !== 409) throw error;
                core.warning(`Standard cancel returned 409 for run ${run.id}; force-cancel will be attempted.`);
              }
            }

            await new Promise(resolve => setTimeout(resolve, 10000));

            let forced = 0;
            for (const run of targets) {
              const { data: current } = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
              if (current.status === 'completed') continue;
              core.warning(`Force-cancel run ${run.id}; current status=${current.status}`);
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
                owner,
                repo,
                run_id: run.id,
              });
              forced += 1;
            }

            core.notice(`Capacity recovery requested cancellation of ${targets.length} stale run(s); force-cancelled ${forced}.`);
