name: Product Perfection Task 6 Review Contrast Repair

on:
  push:
    branches:
      - codex/product-perfection-system-v3
    paths:
      - '.github/workflows/product-perfection-task6-review-contrast.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove Review contrast regression is RED
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/ui-v3-review-runtime-contrast.test.mjs; then
            echo 'Expected Review contrast regression to be RED before repair' >&2
            exit 1
          fi
      - name: Apply bounded semantic repair
        run: |
          python -m py_compile scripts/apply-product-perfection-task6-review-contrast.py
          python scripts/apply-product-perfection-task6-review-contrast.py
      - name: Verify GREEN and canonical distribution
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/ui-v3-review-runtime-contrast.test.mjs tests/ui-v3-mission-review-perfection.test.mjs tests/ui-v3-review.test.mjs tests/ui-v3-accessibility.test.mjs tests/ui-v3-perfection-authority.test.mjs
          npm run validate:ui-tokens
          npm run build:ui-v3
          git diff --check
      - name: Commit exact Review contrast repair
        shell: bash
        run: |
          set -euo pipefail
          git rm -f scripts/apply-product-perfection-task6-review-contrast.py .github/workflows/product-perfection-task6-review-contrast.yml .github/workflows/product-perfection-task6-review-diagnostics.yml
          git add ui-v3/styles/pages/review.css tests/ui-v3-review-runtime-contrast.test.mjs ui-dist
          git config user.name 'nolane-evidence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(ui): raise Review summary label contrast'
          git push origin HEAD:codex/product-perfection-system-v3
