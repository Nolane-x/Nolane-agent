name: Product Perfection Experience Regimes

on:
  push:
    branches:
      - codex/product-perfection-system-v3

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Write experience regime regression tests and prove RED
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/ui-v3-experience-regime-perfection.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { renderExperienceSwitcher } from '../ui-v3/components/experience-switcher/experience-switcher.mjs';

          const read = (file) => readFile(new URL(`../${file}`, import.meta.url), 'utf8');

          test('experience transition restores a visible switcher focus target after hidden-menu selection', async () => {
            const app = await read('ui-v3/app.mjs');
            assert.match(app, /restoreSwitcherFocus/);
            assert.match(app, /document\.activeElement\?\.closest\?\.\('\[data-experience-switcher\]'\)/);
            assert.match(app, /focusExperienceTrigger/);
            assert.match(app, /await render\(result\.path\);[\s\S]*focusExperienceTrigger/);
          });

          test('busy experience switcher announces busy state instead of disabled-only silence', () => {
            const html = renderExperienceSwitcher({ current: 'studio', busy: true });
            assert.match(html, /aria-busy="true"/);
            assert.match(html, /disabled/);
          });

          test('experience regime density reaches real shell rows and controls', async () => {
            const shell = await read('ui-v3/styles/layout/app-shell.css');
            const switcher = await read('ui-v3/styles/components/experience-switcher.css');
            for (const expected of [
              /session-sidebar__new\{[^}]*min-height:var\(--density-control-height\)/,
              /session-sidebar__search\{[^}]*min-height:var\(--density-control-height\)/,
              /session-row\{[^}]*min-height:var\(--density-row-height\)/,
              /app-topbar__actions>button\{[^}]*height:var\(--density-control-height\)/,
            ]) assert.match(shell, expected);
            assert.match(switcher, /experience-pill[^}]*height:var\(--density-control-height\)/);
            assert.match(switcher, /experience-switcher__options>button\{[^}]*min-height:var\(--density-row-height\)/);
          });

          test('experience descriptions wrap instead of becoming hover-only ellipsis', async () => {
            const css = await read('ui-v3/styles/components/experience-switcher.css');
            const match = css.match(/\.experience-switcher__options small\{([^}]*)\}/);
            assert.ok(match);
            assert.doesNotMatch(match[1], /white-space:nowrap/);
            assert.doesNotMatch(match[1], /text-overflow:ellipsis/);
            assert.match(match[1], /line-height:/);
          });
          EOF
          if node --test tests/ui-v3-experience-regime-perfection.test.mjs; then
            echo 'Expected RED before experience-regime hardening, but test passed' >&2
            exit 1
          fi

      - name: Apply focus, busy, density and copy hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          switcher = Path('ui-v3/components/experience-switcher/experience-switcher.mjs')
          s = switcher.read_text()
          old = 'aria-controls="experience-switcher-menu"${busy ? \' disabled\' : \'\'}>'
          new = 'aria-controls="experience-switcher-menu" aria-busy="${busy ? \'true\' : \'false\'}"${busy ? \' disabled\' : \'\'}>'
          if s.count(old) != 1: raise SystemExit('unexpected experience switcher button shape')
          switcher.write_text(s.replace(old, new))

          app = Path('ui-v3/app.mjs')
          s = app.read_text()
          anchor = "function announceExperience(message, state = 'ready') {"
          helper = "function focusExperienceTrigger() {\n  requestAnimationFrame(() => document.querySelector('[data-command=\\\"toggle-experience\\\"]')?.focus({ preventScroll: true }));\n}\n\n"
          if s.count(anchor) != 1: raise SystemExit('unexpected experience announce authority')
          s = s.replace(anchor, helper + anchor)
          old_select = "  const target = normalizeExperience(level);\n  const current = currentExperience;\n  setExperienceMenu(false);\n  if (target === current) return;\n  const button = document.querySelector('[data-command=\"toggle-experience\"]');\n  if (button) button.disabled = true;"
          new_select = "  const target = normalizeExperience(level);\n  const current = currentExperience;\n  const restoreSwitcherFocus = Boolean(document.activeElement?.closest?.('[data-experience-switcher]'));\n  setExperienceMenu(false);\n  if (target === current) { if (restoreSwitcherFocus) focusExperienceTrigger(); return; }\n  const button = document.querySelector('[data-command=\"toggle-experience\"]');\n  if (button) { button.disabled = true; button.setAttribute('aria-busy', 'true'); }"
          if s.count(old_select) != 1: raise SystemExit('unexpected selectExperience prelude')
          s = s.replace(old_select, new_select)
          old_fail = "    if (button) button.disabled = false;\n    announceExperience"
          new_fail = "    if (button) { button.disabled = false; button.setAttribute('aria-busy', 'false'); }\n    if (restoreSwitcherFocus) focusExperienceTrigger();\n    announceExperience"
          if s.count(old_fail) != 1: raise SystemExit('unexpected experience failure branch')
          s = s.replace(old_fail, new_fail)
          old_success = "  await render(result.path);\n  viewStateBridge.restore(document, { experience: target });\n  announceExperience"
          new_success = "  await render(result.path);\n  viewStateBridge.restore(document, { experience: target });\n  if (restoreSwitcherFocus) focusExperienceTrigger();\n  announceExperience"
          if s.count(old_success) != 1: raise SystemExit('unexpected experience success branch')
          app.write_text(s.replace(old_success, new_success))

          shell = Path('ui-v3/styles/layout/app-shell.css')
          s = shell.read_text()
          replacements = {
            '.session-sidebar__new{display:grid;': '.session-sidebar__new{display:grid;min-height:var(--density-control-height);',
            '.session-sidebar__search{display:flex;align-items:center;gap:8px;margin:10px 0;padding:0 9px;min-height:36px;': '.session-sidebar__search{display:flex;align-items:center;gap:8px;margin:10px 0;padding:0 9px;min-height:var(--density-control-height);',
            '.session-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;min-height:40px;': '.session-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;min-height:var(--density-row-height);',
            '.app-topbar__actions>button{position:relative;display:grid;place-items:center;min-width:34px;height:34px;': '.app-topbar__actions>button{position:relative;display:grid;place-items:center;min-width:34px;height:var(--density-control-height);',
          }
          for old, new in replacements.items():
            if s.count(old) != 1: raise SystemExit(f'unexpected shell density authority: {old}')
            s = s.replace(old, new)
          shell.write_text(s)

          css = Path('ui-v3/styles/components/experience-switcher.css')
          s = css.read_text()
          old_pill = '.app-topbar__actions>.experience-switcher>.experience-pill{position:relative;display:flex;align-items:center;width:auto;min-width:34px;height:34px;'
          new_pill = '.app-topbar__actions>.experience-switcher>.experience-pill{position:relative;display:flex;align-items:center;width:auto;min-width:34px;height:var(--density-control-height);'
          if s.count(old_pill) != 1: raise SystemExit('unexpected experience pill density authority')
          s = s.replace(old_pill, new_pill)
          old_option = '.experience-switcher__options>button{display:grid;grid-template-columns:28px minmax(0,1fr) 20px;align-items:center;gap:9px;width:100%;padding:9px;'
          new_option = '.experience-switcher__options>button{display:grid;grid-template-columns:28px minmax(0,1fr) 20px;align-items:center;gap:9px;width:100%;min-height:var(--density-row-height);padding:9px;'
          if s.count(old_option) != 1: raise SystemExit('unexpected experience option density authority')
          s = s.replace(old_option, new_option)
          old_desc = '.experience-switcher__options small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary);font-size:9px}'
          new_desc = '.experience-switcher__options small{color:var(--text-secondary);font-size:9px;line-height:1.35;overflow-wrap:anywhere}'
          if s.count(old_desc) != 1: raise SystemExit('unexpected experience description rule')
          css.write_text(s.replace(old_desc, new_desc))
          PY

      - name: Prove GREEN and canonical build
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/ui-v3-experience-regime-perfection.test.mjs tests/experience-switcher.test.mjs tests/experience-switcher-wiring.test.mjs tests/ui-v3-view-state-preserver.test.mjs tests/ui-v3-shell.test.mjs tests/ui-v3-perfection-authority.test.mjs
          npm run validate:ui-tokens
          npm run build:ui-v3
          git diff --check

      - name: Scope guard and commit experience hardening
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
          for file in "${changed[@]}"; do
            case "$file" in
              ui-v3/app.mjs|ui-v3/components/experience-switcher/experience-switcher.mjs|ui-v3/styles/components/experience-switcher.css|ui-v3/styles/layout/app-shell.css|tests/ui-v3-experience-regime-perfection.test.mjs|ui-dist/*) ;;
              *) echo "unexpected experience-regime change: $file" >&2; exit 1 ;;
            esac
          done
          git add ui-v3/app.mjs ui-v3/components/experience-switcher/experience-switcher.mjs ui-v3/styles/components/experience-switcher.css ui-v3/styles/layout/app-shell.css tests/ui-v3-experience-regime-perfection.test.mjs ui-dist
          git config user.name 'nolane-evidence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(ui): harden experience regimes and focus continuity'
          git push origin HEAD:codex/product-perfection-system-v3
