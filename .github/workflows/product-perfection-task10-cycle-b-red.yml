name: Product Perfection Task 10 NUI Cycle B RED

on:
  push:
    branches: [codex/product-perfection-system-v3]
    paths:
      - 'tests/ui-v3-settings-save-state-material.test.mjs'
      - '.github/workflows/product-perfection-task10-cycle-b-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tests/ui-v3-settings-save-state-material.test.mjs
