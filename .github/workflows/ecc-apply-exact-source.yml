name: ECC exact-source patch

on:
  push:
    branches:
      - codex/ephemeral-capability-composition-v1
    paths:
      - .github/workflows/ecc-apply-exact-source.yml
      - scripts/apply-ecc-agent-loop.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ephemeral-capability-composition-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply asserted exact-source patch
        run: node scripts/apply-ecc-agent-loop.mjs
      - name: Verify syntax and focused RED-to-GREEN suite
        run: |
          node --check src/agent/agent-loop.mjs
          node --test tests/ephemeral-capability-registry.test.mjs tests/agent-loop-ephemeral-capability.test.mjs
      - name: Commit patched AgentLoop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent/agent-loop.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate governed ephemeral capability composition"
          git push origin HEAD:codex/ephemeral-capability-composition-v1
