name: Product Perfection Mission Review RED

on:
  push:
    branches:
      - codex/product-perfection-system-v3

permissions:
  contents: read

jobs:
  prove-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prove mission/review perfection contract is RED before implementation
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/ui-v3-mission-review-perfection.test.mjs; then
            echo 'Expected RED before Mission/Review implementation' >&2
            exit 1
          fi
          echo 'Mission/Review perfection contract is RED as expected.'
