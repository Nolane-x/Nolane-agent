name: Product Perfection Task 10 NUI Cycle A GREEN

on:
  push:
    branches: [codex/product-perfection-system-v3]
    paths:
      - '.github/workflows/product-perfection-task10-cycle-a-green.yml'
      - 'scripts/apply-product-perfection-task10-cycle-a.mjs'

permissions:
  contents: write

jobs:
  cycle-a:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NOLANE_AGENT_HOST: 127.0.0.1
      NOLANE_AGENT_PORT: 4173
      NOLANE_AGENT_TOKEN: nolane-task10-cycle-a-token
      NOLANE_UI_RUNTIME_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Apply guarded Cycle A repair
        run: |
          set -euo pipefail
          node scripts/apply-product-perfection-task10-cycle-a.mjs

      - name: Verify Cycle A source GREEN
        run: |
          set -euo pipefail
          node --check scripts/capture-ui-runtime-visual.mjs
          node --test \
            tests/ui-v3-settings-compact-recomposition.test.mjs \
            tests/ui-runtime-product-perfection-matrix.test.mjs \
            tests/ui-runtime-preference-auth.test.mjs \
            tests/ui-runtime-visual-workflow.test.mjs \
            tests/ui-v3-settings-controller.test.mjs \
            tests/ui-v3-settings-route.test.mjs \
            tests/ui-v3-settings-contrast.test.mjs \
            tests/ui-v3-accessibility.test.mjs
          npm run validate:ui-tokens
          npm run audit:ui-quality
          npm run build:ui-v3
          git diff --check

      - name: Create and reverify exact Cycle A candidate
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/product-perfection-task10-cycle-a-green.yml \
            .github/workflows/product-perfection-task10-settings-compact-red.yml \
            .github/workflows/product-perfection-task10-green-v3.yml \
            .github/workflows/product-perfection-task10-preference-auth-red.yml \
            scripts/apply-product-perfection-task10-cycle-a.mjs
          git add ui-v3/styles/responsive.css scripts/capture-ui-runtime-visual.mjs ui-dist
          git config user.name nolane-evidence-bot
          git config user.email actions@users.noreply.github.com
          git commit -m 'fix(ui): recompose compact localized Settings hierarchy'
          echo "NOLANE_UI_EVIDENCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node --test tests/ui-v3-settings-compact-recomposition.test.mjs tests/ui-runtime-product-perfection-matrix.test.mjs tests/ui-runtime-preference-auth.test.mjs tests/ui-v3-settings-route.test.mjs
          npm run build:ui-v3
          git diff --exit-code -- ui-dist
          npm run validate:ui-tokens
          npm run audit:ui-quality
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Install Chromium and Axe
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2 @axe-core/playwright@4.12.1
          npx playwright install --with-deps chromium

      - name: Start exact Cycle A source runtime
        env:
          NOLANE_AGENT_DATA_DIR: ${{ runner.temp }}/nolane-task10-cycle-a-data
        run: |
          set -euo pipefail
          node src/app.mjs > "$RUNNER_TEMP/nolane-task10-cycle-a.log" 2>&1 &
          echo "NOLANE_TASK10_CYCLE_A_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$NOLANE_UI_RUNTIME_URL/health" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nolane-task10-cycle-a.log"
          exit 1

      - name: Re-observe compact Vietnamese Settings
        env:
          NOLANE_UI_VISUAL_OUTPUT: ${{ runner.temp }}/task10-cycle-a
        run: |
          set -euo pipefail
          NOLANE_UI_VISUAL_STATES=onboarding node scripts/capture-ui-runtime-visual.mjs
          NOLANE_UI_VISUAL_STATES=settings-vi-compact node scripts/capture-ui-runtime-visual.mjs
          node - <<'NODE'
          const fs = require('fs');
          const p = process.env.RUNNER_TEMP + '/task10-cycle-a/receipt.json';
          const receipt = JSON.parse(fs.readFileSync(p, 'utf8'));
          const state = receipt.captures.find((item) => item.id === 'settings-vi-compact');
          if (!state) throw new Error('settings-vi-compact capture missing');
          if (state.runtimeAssertions?.settingsCompactHierarchy !== 'PASS') throw new Error('compact Settings hierarchy did not pass runtime assertion');
          if (state.runtimeMetadata?.overflow?.horizontal !== 'PASS') throw new Error('compact Settings overflow regression');
          if (state.runtimeMetadata?.axe?.seriousCritical !== 'PASS') throw new Error('compact Settings Axe regression');
          console.log(JSON.stringify({ revision: process.env.NOLANE_UI_EVIDENCE_REVISION, receiptSha256: receipt.receiptSha256, screenshotSha256: state.sha256 }));
          NODE

      - name: Upload Cycle A re-observation
        uses: actions/upload-artifact@v6
        with:
          name: product-perfection-task10-cycle-a
          path: ${{ runner.temp }}/task10-cycle-a
          if-no-files-found: error
          retention-days: 21

      - name: Push exact Cycle A candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NOLANE_UI_EVIDENCE_REVISION"
          git fetch origin codex/product-perfection-system-v3
          test "$(git merge-base HEAD origin/codex/product-perfection-system-v3)" = "$(git rev-parse origin/codex/product-perfection-system-v3)"
          git push origin HEAD:codex/product-perfection-system-v3

      - name: Stop runtime
        if: always()
        run: |
          if [ -n "${NOLANE_TASK10_CYCLE_A_PID:-}" ]; then kill "$NOLANE_TASK10_CYCLE_A_PID" || true; fi
