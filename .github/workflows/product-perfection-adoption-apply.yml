name: Product Perfection Adoption Apply

on:
  push:
    branches:
      - codex/product-perfection-system-v3

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove RED
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/ui-v3-adoption-perfection.test.mjs; then
            echo 'Expected adoption contract to be RED before migration' >&2
            exit 1
          fi
      - name: Apply bounded migration
        run: python scripts/apply-product-perfection-adoption.py
      - name: Diagnose GREEN contracts
        id: diagnose
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/green-diagnostics.log"
          : > "$LOG"
          status=0
          for test_file in \
            tests/ui-v3-adoption-perfection.test.mjs \
            tests/ui-v3-home.test.mjs \
            tests/ui-v3-project-view.test.mjs \
            tests/ui-v3-project-picker.test.mjs \
            tests/ui-v3-project-switcher.test.mjs \
            tests/onboarding-ui.test.mjs \
            tests/ui-v3-workroom-welcome-contrast.test.mjs \
            tests/ui-v3-shell.test.mjs; do
            echo "===== $test_file =====" | tee -a "$LOG"
            node --test "$test_file" 2>&1 | tee -a "$LOG"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status="$code"; fi
          done
          echo '===== validate:ui-tokens =====' | tee -a "$LOG"
          npm run validate:ui-tokens 2>&1 | tee -a "$LOG"
          code=${PIPESTATUS[0]}; if [ "$code" -ne 0 ]; then status="$code"; fi
          echo '===== build:ui-v3 =====' | tee -a "$LOG"
          npm run build:ui-v3 2>&1 | tee -a "$LOG"
          code=${PIPESTATUS[0]}; if [ "$code" -ne 0 ]; then status="$code"; fi
          echo '===== diff-check =====' | tee -a "$LOG"
          git diff --check 2>&1 | tee -a "$LOG"
          code=${PIPESTATUS[0]}; if [ "$code" -ne 0 ]; then status="$code"; fi
          echo "green_status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload GREEN diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: adoption-green-diagnostics
          path: ${{ runner.temp }}/green-diagnostics.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce GREEN result
        if: ${{ steps.diagnose.outputs.green_status != '0' }}
        run: exit 1
      - name: Scope guard and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
          for file in "${changed[@]}"; do
            case "$file" in
              ui-v3/views/home/home-view.mjs|ui-v3/views/projects/project-view.mjs|ui-v3/app.mjs|ui-v3/styles/pages/home.css|ui-v3/styles/pages/projects.css|ui-dist/*) ;;
              *) echo "unexpected adoption migration output: $file" >&2; exit 1 ;;
            esac
          done
          git add ui-v3/views/home/home-view.mjs ui-v3/views/projects/project-view.mjs ui-v3/app.mjs ui-v3/styles/pages/home.css ui-v3/styles/pages/projects.css ui-dist
          git config user.name 'nolane-evidence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(ui): close adoption recovery and Projects search states'
          git push origin HEAD:codex/product-perfection-system-v3
