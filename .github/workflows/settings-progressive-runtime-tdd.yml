name: Settings progressive runtime TDD

on:
  pull_request:
    types: [reopened]
    paths:
      - 'scripts/capture-ui-runtime-visual.mjs'
      - 'tests/ui-settings-progressive-runtime-contract.test.mjs'
      - '.github/workflows/settings-progressive-runtime-tdd.yml'

permissions:
  contents: read

jobs:
  focused-settings-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run focused Settings runtime contract
        run: node --test tests/ui-settings-progressive-runtime-contract.test.mjs
