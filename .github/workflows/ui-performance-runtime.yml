name: UI runtime performance evidence

on:
  pull_request:
    paths:
      - 'scripts/capture-ui-performance-evidence.mjs'
      - 'tests/ui-performance-runtime-evidence.test.mjs'
      - '.github/workflows/ui-performance-runtime.yml'
      - 'src/**'
      - 'ui-v3/**'
      - 'ui-dist/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-performance-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-performance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux
          - os: windows-latest
            slug: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NOLANE_AGENT_HOST: 127.0.0.1
      NOLANE_AGENT_PORT: 4181
      NOLANE_AGENT_TOKEN: nolane-ui-performance-evidence-token
      NOLANE_UI_RUNTIME_URL: http://127.0.0.1:4181

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked source dependencies
        run: npm ci --ignore-scripts
      - name: Prove performance evidence contract
        run: node --test tests/ui-performance-runtime-evidence.test.mjs
      - name: Install Chromium performance tooling
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          if ($env:RUNNER_OS -eq 'Linux') {
            npx playwright install --with-deps chromium
          } else {
            npx playwright install chromium
          }
      - name: Capture candidate performance evidence
        shell: pwsh
        env:
          NOLANE_AGENT_DATA_DIR: ${{ runner.temp }}/nolane-ui-performance-data
          NOLANE_UI_PERFORMANCE_OUTPUT: ${{ runner.temp }}/nolane-ui-performance
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'nolane-ui-performance-runtime.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'nolane-ui-performance-runtime.stderr.log'
          $runtime = Start-Process -FilePath node -ArgumentList 'src/app.mjs' -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $healthy = $false
            for ($attempt = 1; $attempt -le 60; $attempt += 1) {
              try {
                Invoke-WebRequest -Uri "$env:NOLANE_UI_RUNTIME_URL/health" -UseBasicParsing -ErrorAction Stop | Out-Null
                $healthy = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (!$healthy) { throw 'Performance source runtime did not become healthy within 60 seconds' }
            node scripts/capture-ui-performance-evidence.mjs
            if ($LASTEXITCODE -ne 0) { throw "Performance evidence capture failed with exit code $LASTEXITCODE" }
          } finally {
            if (!$runtime.HasExited) { Stop-Process -Id $runtime.Id -Force -ErrorAction SilentlyContinue }
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
          }
      - name: Upload performance candidate receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-performance-${{ matrix.slug }}
          path: ${{ runner.temp }}/nolane-ui-performance
          if-no-files-found: error
          retention-days: 14
