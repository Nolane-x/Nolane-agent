name: ECC hardening apply

on:
  push:
    branches:
      - codex/ephemeral-capability-composition-v1
    paths:
      - scripts/apply-ecc-hardening.mjs
      - .github/workflows/ecc-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ephemeral-capability-composition-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply asserted hardening patch
        run: node scripts/apply-ecc-hardening.mjs
      - name: Verify focused ECC suite
        run: |
          node --check src/agent/ephemeral-capability-registry.mjs
          node --check src/agent/agent-loop.mjs
          node --test tests/ephemeral-capability-registry.test.mjs tests/ephemeral-capability-input-validation.test.mjs tests/agent-loop-ephemeral-capability.test.mjs
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent/ephemeral-capability-registry.mjs src/agent/agent-loop.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden ephemeral capability input validation"
          git push origin HEAD:codex/ephemeral-capability-composition-v1
