name: UI distribution snapshot

on:
  push:
    branches:
      - codex/ui-runtime-certification-evidence
    paths:
      - 'ui-v3/**'
      - 'scripts/build-ui-v3.mjs'
      - '.github/workflows/ui-dist-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-dist-snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-snapshot:
    if: github.ref == 'refs/heads/codex/ui-runtime-certification-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked source dependencies
        run: npm ci --ignore-scripts
      - name: Build deterministic UI distribution
        run: npm run build:ui-v3
      - name: Commit generated UI distribution on the internal evidence branch
        shell: bash
        run: |
          if git diff --quiet -- ui-dist; then
            echo 'ui-dist already matches ui-v3'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-dist
          git commit -m 'build(ui): refresh committed distribution'
          git push origin HEAD:codex/ui-runtime-certification-evidence
      - name: Upload generated UI distribution
        uses: actions/upload-artifact@v6
        with:
          name: ui-dist-snapshot-${{ github.sha }}
          path: ui-dist
          if-no-files-found: error
          retention-days: 3
