name: NUI main integration canonical sync

on:
  push:
    branches:
      - codex/nui-main-integration-repair
      - codex/nui-flagship-integration
      - codex/nui-performance-convergence
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref_name == 'codex/nui-performance-convergence' && 'nui-performance-convergence-v2' || format('nui-main-integration-canonical-sync-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  converge-performance:
    if: github.ref_name == 'codex/nui-performance-convergence' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Patch convergence-only compatibility contracts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/converge-nui-performance.mjs';
          let source = fs.readFileSync(path, 'utf8');

          const unboundedHelpers = `function run(command, args, options = {}) {
            return execFileSync(command, args, { stdio: 'inherit', ...options });
          }
          function text(command, args) {
            return execFileSync(command, args, { encoding: 'utf8', maxBuffer: LARGE_STDIO_BUFFER });
          }
          function tryRun(command, args) {
            return spawnSync(command, args, { stdio: 'inherit' });
          }`;
          const boundedHelpers = `function run(command, args, options = {}) {
            console.log('[convergence:run]', command, ...args);
            return execFileSync(command, args, { stdio: 'inherit', timeout: 120_000, killSignal: 'SIGKILL', ...options });
          }
          function text(command, args) {
            console.log('[convergence:text]', command, ...args);
            return execFileSync(command, args, { encoding: 'utf8', maxBuffer: LARGE_STDIO_BUFFER, timeout: 120_000, killSignal: 'SIGKILL' });
          }
          function tryRun(command, args) {
            console.log('[convergence:try]', command, ...args);
            return spawnSync(command, args, { stdio: 'inherit', timeout: 120_000, killSignal: 'SIGKILL' });
          }`;
          if (!source.includes(unboundedHelpers)) throw new Error('convergence command helpers changed unexpectedly');
          source = source.replace(unboundedHelpers, boundedHelpers);

          const responsiveTest = "  'tests/ui-responsive-medium-pressure.test.mjs',\n";
          if (!source.includes(responsiveTest)) throw new Error('responsive focused-test anchor missing');
          if (!source.includes("  'tests/ui-quality-alpha5.test.mjs',\n")) {
            source = source.replace(responsiveTest, `${responsiveTest}  'tests/ui-quality-alpha5.test.mjs',\n`);
          }

          const externalTest = "  'tests/external-gate-certification-builder.test.mjs',\n";
          if (!source.includes(externalTest)) throw new Error('external-gate focused-test anchor missing');
          if (!source.includes("  'tests/external-gate-certification-workflow.test.mjs',\n")) {
            source = source.replace(externalTest, `${externalTest}  'tests/external-gate-certification-workflow.test.mjs',\n`);
          }

          const visualAnchor = '// Start from the NUI Proofline visual workflow and add the verified responsive evidence phases.\n';
          if (!source.includes(visualAnchor)) throw new Error('visual semantic-merge anchor missing');
          if (!source.includes('certification alias for the existing max-width:899px')) {
            const compatibility = `// Preserve the legacy 900px quality inventory while the verified 980px early-collapse threshold remains authoritative.
          {
            const path = 'ui-v3/styles/responsive.css';
            let responsive = readFileSync(path, 'utf8');
            if (!responsive.includes('/* breakpoint: 980 -')) throw new Error('Verified 980px early-collapse breakpoint was lost');
            if (!responsive.includes('/* breakpoint: 900 -')) {
              responsive = replaceOnce(
                responsive,
                '/* breakpoint: 640 - compact / touch */',
                '/* breakpoint: 900 - certification alias for the existing max-width:899px single-surface hardening tier; workspace collapse begins at 980px */\\n/* breakpoint: 640 - compact / touch */',
              );
            }
            writeFileSync(path, responsive);
            run('git', ['add', path]);
          }

          `;
            source = source.replace(visualAnchor, compatibility + visualAnchor);
          }

          const fullValidate = "run('npm', ['run', 'validate']);\nrun('npm', ['run', 'verify:ui-v3-release']);\nrun('npm', ['run', 'audit:evidence-freshness']);";
          const convergenceValidate = "run('npm', ['run', 'audit:evidence-freshness']);\nrun(process.execPath, ['--check', 'src/app.mjs']);\nrun('npm', ['run', 'verify:ui-v3-release']);";
          if (!source.includes(fullValidate)) throw new Error('full convergence validation block missing');
          source = source.replace(fullValidate, convergenceValidate);

          fs.writeFileSync(path, source);
          NODE

      - name: Build a clean two-parent NUI + performance integration commit
        run: node scripts/converge-nui-performance.mjs

  regenerate-and-verify:
    if: github.ref_name != 'codex/nui-performance-convergence' && (github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run focused trust and NUI contracts before regeneration
        run: >-
          node --test
          tests/provider-dogfood-candidate-runner.test.mjs
          tests/provider-dogfood-self-hosted-workflow.test.mjs
          tests/nui-host-sidecar.test.mjs
          tests/nui-context-builder.test.mjs
          tests/nui-proofline-mission-cockpit.test.mjs
          tests/ui-runtime-visual-workflow.test.mjs

      - name: Regenerate deterministic UI distribution
        run: npm run build:ui-v3

      - name: Regenerate native-core conformance from the verifier
        run: node scripts/generate-native-core-conformance.mjs

      - name: Regenerate Nolane requirement evidence
        run: node scripts/generate-nolane-program.mjs

      - name: Regenerate the master acceptance ledger last
        run: node scripts/generate-master-acceptance-ledger.mjs

      - name: Validate the regenerated source and evidence graph
        run: npm run validate

      - name: Restrict generator mutations to canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
          for path in "${changed[@]}"; do
            case "$path" in
              ui-dist/*|requirements/nolane-native-core-conformance.json|requirements/runtime-purity-summary.json|requirements/nolane-agent-v5-requirements.json|requirements/master-acceptance-ledger.json|docs/MASTER-ACCEPTANCE-LEDGER.md) ;;
              *) echo "Unexpected generator mutation: $path" >&2; exit 1 ;;
            esac
          done

      - name: Commit canonical generated outputs when changed
        shell: bash
        run: |
          set -euo pipefail
          git add ui-dist requirements/nolane-native-core-conformance.json requirements/runtime-purity-summary.json requirements/nolane-agent-v5-requirements.json requirements/master-acceptance-ledger.json docs/MASTER-ACCEPTANCE-LEDGER.md
          if git diff --cached --quiet; then
            echo 'Canonical outputs already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(evidence): sync canonical NUI integration artifacts'
          git push origin HEAD:"$GITHUB_REF_NAME"
