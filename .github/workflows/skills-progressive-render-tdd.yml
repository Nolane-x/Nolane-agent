name: Skills progressive rendering TDD

on:
  pull_request:
    types: [reopened]
    paths:
      - 'ui-v3/views/skills/skills-view.mjs'
      - 'tests/ui-v3-skills-progressive-render.test.mjs'
      - '.github/workflows/skills-progressive-render-tdd.yml'

permissions:
  contents: read

jobs:
  focused-skills-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run focused Skills progressive-render contract
        run: node --test tests/ui-v3-skills-progressive-render.test.mjs
