name: Product Perfection Task 7 Studio Browser Closure

on:
  push:
    branches:
      - codex/product-perfection-system-v3
    paths:
      - '.github/workflows/product-perfection-task7-studio-browser.yml'

permissions:
  contents: write

jobs:
  close-task7:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove Task 7 contract is RED
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/ui-v3-studio-browser-perfection.test.mjs; then
            echo 'Expected Studio/Browser perfection contract to be RED before migration' >&2
            exit 1
          fi
      - name: Apply guarded Studio Browser migration
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply-product-perfection-task7.py
          python scripts/apply-product-perfection-task7.py
          node --check ui-v3/app.mjs
          node --check ui-v3/views/workroom/workroom-view.mjs
          node --check ui-v3/views/browser/browser-view.mjs
          node --check ui-v3/views/browser/browser-inspector.mjs
      - name: Verify focused GREEN and canonical distribution
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/ui-v3-studio-browser-perfection.test.mjs \
            tests/ui-v3-workroom.test.mjs \
            tests/ui-v3-workroom-lazy.test.mjs \
            tests/ui-v3-browser-workspace.test.mjs \
            tests/integrated-browser-center-ui.test.mjs \
            tests/ui-v3-accessibility.test.mjs \
            tests/ui-v3-perfection-authority.test.mjs
          npm run validate:ui-tokens
          npm run build:ui-v3
          git diff --check
      - name: Create exact Task 7 implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f scripts/apply-product-perfection-task7.py .github/workflows/product-perfection-task7-studio-browser.yml
          git add \
            ui-v3/app.mjs \
            ui-v3/views/workroom/workroom-view.mjs \
            ui-v3/styles/pages/workroom.css \
            ui-v3/views/browser/browser-view.mjs \
            ui-v3/views/browser/browser-inspector.mjs \
            ui-v3/styles/pages/browser.css \
            tests/ui-v3-studio-browser-perfection.test.mjs \
            ui-dist
          git config user.name 'nolane-evidence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(ui): close Studio compact panes and Browser trust boundary'
          echo "TASK7_VERIFIED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify exact Task 7 implementation commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TASK7_VERIFIED_SHA"
          node --test \
            tests/ui-v3-studio-browser-perfection.test.mjs \
            tests/ui-v3-workroom.test.mjs \
            tests/ui-v3-workroom-lazy.test.mjs \
            tests/ui-v3-browser-workspace.test.mjs \
            tests/integrated-browser-center-ui.test.mjs \
            tests/ui-v3-accessibility.test.mjs \
            tests/ui-v3-perfection-authority.test.mjs
          npm run validate:ui-tokens
          npm run build:ui-v3
          git diff --exit-code -- ui-dist
          npm run audit:ui-quality
          git diff --check
      - name: Write durable Task 7 source closure
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/product-perfection/TASK7-STUDIO-BROWSER-CLOSURE.md <<EOF2
          # Task 7 — Studio / Browser Source Closure

          **Exact verified implementation revision:** \`${TASK7_VERIFIED_SHA}\`  
          **Workflow run:** \`${GITHUB_RUN_ID}\`  
          **Status:** PASS for source, focused behavior, canonical build, token and static-quality scope.

          Verified:

          - compact Studio exposes explicit Files / Editor / Agent pane switching instead of deleting side panes;
          - Studio route cache is path-scoped so different project URLs do not reuse one stale view model;
          - wide Studio panel/open-state behavior remains covered by existing Workroom tests;
          - Browser inspector exposes explicit origin, active-session and permission-boundary facts;
          - page-derived Browser artifacts are semantically wrapped as bounded external/untrusted content;
          - origin display does not leak query secrets;
          - focused accessibility/perfection contracts pass;
          - canonical \`ui-dist\`, token validation and static UI quality audit pass.

          Runtime visual/Axe re-observation remains required before Task 7 final certification.
          EOF2
          if ! grep -q 'Slice PFX-07 — Studio / Browser continuity and trust boundary' docs/product-perfection/NUI-ROUTE-LEDGER.md; then
            cat >> docs/product-perfection/NUI-ROUTE-LEDGER.md <<'EOF2'

          ---

          ## Slice PFX-07 — Studio / Browser continuity and trust boundary

          **Observed triggers:** compact Studio hid Files/Agent instead of preserving access; Workroom route cache was not project-path scoped; Browser external content lacked an explicit textual/semantic trust boundary despite permission data being available.

          **Activated NUI decision classes:** professional desktop workspace continuity; responsive disclosure; interaction-state preservation; browser trust architecture; permission/provenance clarity; security-oriented interface copy; evidence-gated rendered verification.

          **Omitted for this slice:** broad Studio visual redesign, browser automation capability expansion, provider changes. The failure class is continuity and trust semantics, not feature breadth.

          **Falsification:** the slice is not closed if compact mode makes any core pane unreachable, project-path changes can reuse stale Workroom state, external page-derived content is indistinguishable from trusted Nolane chrome, or URL display can leak query secrets.

          **Evidence boundary:** source/focused tests + canonical build first; runtime wide/compact/Axe evidence required separately. Independent screen-reader/provider claims remain external.
          EOF2
          fi
          git add docs/product-perfection/TASK7-STUDIO-BROWSER-CLOSURE.md docs/product-perfection/NUI-ROUTE-LEDGER.md
          git commit -m 'docs(perfection): record Task 7 source closure [skip ci]'
          git push origin HEAD:codex/product-perfection-system-v3
