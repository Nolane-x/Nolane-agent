name: UI Settings contrast fix

on:
  push:
    branches:
      - codex/ui-runtime-certification-evidence
    paths:
      - '.github/workflows/ui-settings-contrast-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.ref == 'refs/heads/codex/ui-runtime-certification-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply exact semantic foreground fixes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const file = 'ui-v3/styles/pages/settings.css';
          let css = await readFile(file, 'utf8');
          const replacements = [
            [
              '.settings-toolbar h1{font-size:32px}.settings-toolbar>div:first-child>p:last-child',
              '.settings-toolbar h1{font-size:32px}.settings-toolbar>div:first-child>.eyebrow{color:var(--text-secondary)}.settings-toolbar>div:first-child>p:last-child'
            ],
            [
              '.settings-layer{display:flex;flex-direction:column;gap:2px;color:var(--text-muted);font-size:10px}',
              '.settings-layer{display:flex;flex-direction:column;gap:2px;color:var(--text-secondary);font-size:10px}'
            ],
            [
              '.settings-live-status{min-height:22px;color:var(--text-muted);font-size:12px}',
              '.settings-live-status{min-height:22px;color:var(--text-secondary);font-size:12px}'
            ]
          ];
          for (const [from, to] of replacements) {
            const count = css.split(from).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one Settings CSS match, got ${count}: ${from}`);
            css = css.replace(from, to);
          }
          await writeFile(file, css);
          NODE
      - name: Prove focused contrast regressions
        run: node --test tests/ui-v3-settings-contrast.test.mjs tests/ui-v3-skills-contrast.test.mjs
      - name: Build deterministic UI distribution
        run: npm run build:ui-v3
      - name: Commit source and generated distribution atomically
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v3/styles/pages/settings.css ui-dist
          git diff --cached --exit-code && { echo 'Expected Settings contrast changes were not produced'; exit 1; }
          git commit -m 'fix(ui): improve compact Settings metadata contrast'
          git push origin HEAD:codex/ui-runtime-certification-evidence
