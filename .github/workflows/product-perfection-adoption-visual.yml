name: Product Perfection Adoption Visual Re-observation

# Re-observation gate after causal shell, density, focus, contrast, and adoption-path corrections.
on:
  push:
    branches:
      - codex/product-perfection-system-v3
    paths:
      - '.github/workflows/product-perfection-adoption-visual.yml'
      - 'ui-v3/**'
      - 'ui-dist/**'
      - 'scripts/capture-ui-runtime-visual.mjs'
      - 'scripts/capture-ui-responsive-evidence.mjs'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  adoption-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOLANE_AGENT_HOST: 127.0.0.1
      NOLANE_AGENT_PORT: 4173
      NOLANE_AGENT_TOKEN: nolane-product-perfection-adoption-token
      NOLANE_UI_RUNTIME_URL: http://127.0.0.1:4173

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify canonical distribution
        run: |
          npm run build:ui-v3
          git diff --exit-code -- ui-dist
      - name: Install Chromium + Axe
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2 @axe-core/playwright@4.12.1
          npx playwright install --with-deps chromium
      - name: Start authenticated source runtime
        shell: bash
        env:
          NOLANE_AGENT_DATA_DIR: ${{ runner.temp }}/nolane-perfection-adoption-data
        run: |
          set -euo pipefail
          node src/app.mjs > "$RUNNER_TEMP/nolane-adoption.log" 2>&1 &
          echo "NOLANE_ADOPTION_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$NOLANE_UI_RUNTIME_URL/health" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nolane-adoption.log"
          exit 1
      - name: Capture English light adoption surfaces and responsive matrix
        shell: bash
        env:
          NOLANE_UI_VISUAL_OUTPUT: ${{ runner.temp }}/product-perfection-adoption/en-light
          NOLANE_UI_VISUAL_STATES: onboarding,home,home-experience-menu,projects
        run: |
          node scripts/capture-ui-runtime-visual.mjs
          node scripts/capture-ui-responsive-evidence.mjs
      - name: Switch to Vietnamese Nocturne and capture long-copy pressure
        shell: bash
        run: |
          curl --fail --silent --show-error --request PUT \
            --header "authorization: Bearer $NOLANE_AGENT_TOKEN" \
            --header 'content-type: application/json' \
            --data '{"layer":"user","patch":{"general":{"language":"vi"},"appearance":{"theme":"nocturne","accent":"violet"}}}' \
            "$NOLANE_UI_RUNTIME_URL/api/settings" >/dev/null
          NOLANE_UI_VISUAL_OUTPUT="$RUNNER_TEMP/product-perfection-adoption/vi-nocturne" NOLANE_UI_VISUAL_STATES=home,home-experience-menu,projects node scripts/capture-ui-runtime-visual.mjs
      - name: Upload adoption visual re-observation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: product-perfection-adoption-visual
          path: ${{ runner.temp }}/product-perfection-adoption
          if-no-files-found: error
          retention-days: 14
      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [ -n "${NOLANE_ADOPTION_PID:-}" ]; then kill "$NOLANE_ADOPTION_PID" || true; fi
