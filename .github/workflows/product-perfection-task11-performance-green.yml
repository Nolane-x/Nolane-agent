name: Product Perfection Task 11 Performance GREEN

on:
  push:
    branches: [codex/product-perfection-system-v3]
    paths:
      - '.github/workflows/product-perfection-task11-performance-green.yml'
      - 'scripts/apply-product-perfection-task11-performance.mjs'

permissions:
  contents: write

jobs:
  task11-performance-source:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove Task 11 contract is RED before migration
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/ui-performance-product-perfection.test.mjs; then
            echo 'Task 11 performance contract unexpectedly passed before implementation' >&2
            exit 1
          fi
      - name: Apply guarded performance evidence migration
        run: node scripts/apply-product-perfection-task11-performance.mjs
      - name: Verify Task 11 source GREEN
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/capture-ui-performance-evidence.mjs
          node --test tests/ui-performance-product-perfection.test.mjs tests/ui-performance-runtime-evidence.test.mjs
          npm run build:ui-v3
          git diff --exit-code -- ui-dist
          git diff --check
      - name: Commit exact Task 11 performance harness
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/product-perfection-task11-performance-green.yml scripts/apply-product-perfection-task11-performance.mjs
          git add scripts/capture-ui-performance-evidence.mjs tests/ui-performance-product-perfection.test.mjs
          git config user.name nolane-evidence-bot
          git config user.email actions@users.noreply.github.com
          git commit -m 'test(performance): cover changed perfection surfaces and input latency'
          echo "TASK11_IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node --test tests/ui-performance-product-perfection.test.mjs tests/ui-performance-runtime-evidence.test.mjs
          node --check scripts/capture-ui-performance-evidence.mjs
          test -z "$(git status --porcelain)"
      - name: Push exact Task 11 implementation
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/product-perfection-system-v3
