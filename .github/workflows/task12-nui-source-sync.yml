name: Task 12 NUI source sync

on:
  push:
    branches:
      - codex/product-perfection-system-v3

permissions:
  contents: write

concurrency:
  group: task12-nui-source-sync
  cancel-in-progress: true

jobs:
  patch-verify-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Wire blocked-update mission navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ui-v3/app.mjs')
          source = path.read_text()
          old = "if(updateAction){event.preventDefault();if(updateAction==='check')"
          new = "if(updateAction){event.preventDefault();if(updateAction==='missions'){location.hash='/missions';return;}if(updateAction==='check')"
          if old not in source and new not in source:
              raise SystemExit('update action handler marker not found')
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source)
          PY
      - name: Run Task 12 targeted contracts
        run: node --test tests/progressive-update-notice.test.mjs tests/progressive-update-wiring.test.mjs tests/update-notice-nui-contract.test.mjs tests/github-release-workflow.test.mjs tests/release-candidate-gate.test.mjs
      - name: Run full source suite
        run: npm test
      - name: Regenerate deterministic UI distribution
        run: npm run build:ui-v3
      - name: Regenerate native-core conformance
        run: node scripts/generate-native-core-conformance.mjs
      - name: Regenerate Nolane program evidence
        run: node scripts/generate-nolane-program.mjs
      - name: Regenerate master acceptance ledger last
        run: node scripts/generate-master-acceptance-ledger.mjs
      - name: Verify evidence and UI source boundary
        run: |
          npm run audit:evidence-freshness
          npm run verify:ui-v3-release
      - name: Restrict generated mutations
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
          for path in "${changed[@]}"; do
            case "$path" in
              ui-v3/app.mjs|ui-dist/*|requirements/nolane-native-core-conformance.json|requirements/runtime-purity-summary.json|requirements/nolane-agent-v5-requirements.json|requirements/master-acceptance-ledger.json|docs/MASTER-ACCEPTANCE-LEDGER.md|docs/ui-v3/ui-v3-source-release.json) ;;
              *) echo "Unexpected Task 12 mutation: $path" >&2; exit 1 ;;
            esac
          done
      - name: Commit source wiring and canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          git add ui-v3/app.mjs ui-dist requirements/nolane-native-core-conformance.json requirements/runtime-purity-summary.json requirements/nolane-agent-v5-requirements.json requirements/master-acceptance-ledger.json docs/MASTER-ACCEPTANCE-LEDGER.md docs/ui-v3/ui-v3-source-release.json
          if git diff --cached --quiet; then
            echo 'Task 12 NUI source already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ui): sync NUI update surface and canonical evidence'
          git push origin HEAD:${GITHUB_REF_NAME}
