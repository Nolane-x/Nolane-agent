name: External gate evidence

on:
  push:
    branches:
      - codex/external-gate-evidence
  pull_request:
    paths:
      - 'src/**'
      - 'native/**'
      - 'launcher/**'
      - 'config/**'
      - 'vendor/forge-os/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'go.work'
      - '.github/workflows/external-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-evidence:
    name: ${{ matrix.label }} evidence
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            slug: linux
            fullSourceSuite: true
          - os: windows-latest
            label: Windows
            slug: windows
            fullSourceSuite: false
          - os: macos-latest
            label: macOS
            slug: macos
            fullSourceSuite: false

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout pinned Tree-sitter JavaScript grammar
        uses: actions/checkout@v6
        with:
          repository: tree-sitter/tree-sitter-javascript
          ref: 3a837b6f3658ca3618f2022f8707e29739c91364
          path: .ci/tree-sitter-grammars/tree-sitter-javascript
          persist-credentials: false

      - name: Mark linked issue evidence
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $event = Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          if ([string]$event.pull_request.body -match '(?im)^\s*closes\s+#\d+\b') {
            "NOLANE_GITHUB_ISSUE_LINKED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.x
          cache-dependency-path: |
            launcher/go.mod
            native/pty/go.mod
            native/credential/go.mod
            native/job-object/go.mod

      - name: Install locked source dependencies
        run: npm ci --ignore-scripts

      - name: Install the pinned Tree-sitter CLI runtime
        run: npm install --global --allow-scripts=tree-sitter-cli tree-sitter-cli@0.25.10

      - name: Run real Tree-sitter grammar gate
        env:
          NOLANE_RUNTIME_TREE_SITTER_GATE: '1'
          NOLANE_TREE_SITTER_JAVASCRIPT_DIR: ${{ github.workspace }}/.ci/tree-sitter-grammars/tree-sitter-javascript
        run: node --test tests/tree-sitter-runtime-evidence.test.mjs

      - name: Install Podman on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman

      - name: Run real Podman sandbox gate
        if: matrix.slug == 'linux'
        env:
          NOLANE_RUNTIME_PODMAN_GATE: '1'
        run: node --test tests/podman-runtime-evidence.test.mjs

      - name: Run real macOS sandbox gate
        if: matrix.slug == 'macos'
        env:
          NOLANE_RUNTIME_MACOS_SANDBOX_GATE: '1'
        run: node --test tests/macos-sandbox-runtime-evidence.test.mjs

      - name: Build the Windows native gate helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location native/credential
          go build -trimpath -o "$env:RUNNER_TEMP\NolaneCredential.exe" .
          Pop-Location
          Push-Location native/job-object
          go build -trimpath -o "$env:RUNNER_TEMP\ForgeJobObject.exe" .
          Pop-Location
          "NOLANE_CREDENTIAL_HELPER=$env:RUNNER_TEMP\NolaneCredential.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NOLANE_JOB_OBJECT_HELPER=$env:RUNNER_TEMP\ForgeJobObject.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run the source suite
        if: matrix.fullSourceSuite
        run: npm run validate

      - name: Run native Go tests
        if: always()
        run: npm run test:go

      - name: Verify external gate evidence contracts
        if: always()
        run: node --test tests/external-gate-evidence.test.mjs tests/external-gate-workflow.test.mjs tests/native-sandbox-drivers.test.mjs tests/completion-release-gate.test.mjs

      - name: Collect runner-bound evidence
        if: always()
        env:
          NOLANE_GATE_OUTPUT: ${{ runner.temp }}/external-gates/${{ matrix.slug }}.json
        run: npm run audit:external-gates

      - name: Upload redacted gate receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: external-gates-${{ matrix.slug }}
          path: ${{ runner.temp }}/external-gates/${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 14
