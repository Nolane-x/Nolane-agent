name: Settings progressive rendering TDD

on:
  pull_request:
    types: [reopened]
    paths:
      - 'ui-v3/views/settings/settings-view.mjs'
      - 'tests/ui-v3-settings-controller.test.mjs'
      - '.github/workflows/settings-progressive-render-tdd.yml'

permissions:
  contents: read

jobs:
  focused-settings-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run focused Settings rendering contract
        run: node --test tests/ui-v3-settings-controller.test.mjs
