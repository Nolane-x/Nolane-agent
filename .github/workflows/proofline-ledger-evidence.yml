name: Proofline ledger runtime evidence

on:
  pull_request:
    paths:
      - 'ui-v3/**'
      - 'src/**'
      - 'scripts/capture-proofline-ledger-evidence.mjs'
      - 'tests/nui-proofline-ledger-runtime-evidence.test.mjs'
      - '.github/workflows/proofline-ledger-evidence.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOLANE_AGENT_HOST: 127.0.0.1
      NOLANE_AGENT_PORT: 4174
      NOLANE_AGENT_TOKEN: nolane-proofline-ledger-evidence-token
      NOLANE_UI_RUNTIME_URL: http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked source dependencies
        run: npm ci --ignore-scripts
      - name: Build and verify committed UI distribution
        run: |
          npm run build:ui-v3
          git diff --exit-code -- ui-dist
      - name: Install Chromium and accessibility runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2 @axe-core/playwright@4.12.1
          npx playwright install --with-deps chromium
      - name: Start authenticated source runtime
        shell: bash
        run: |
          echo "NOLANE_AGENT_DATA_DIR=$RUNNER_TEMP/nolane-proofline-ledger-data" >> "$GITHUB_ENV"
          NOLANE_AGENT_DATA_DIR="$RUNNER_TEMP/nolane-proofline-ledger-data" node src/app.mjs > "$RUNNER_TEMP/nolane-proofline-ledger-runtime.log" 2>&1 &
          echo "NOLANE_PROOFLINE_LEDGER_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$NOLANE_UI_RUNTIME_URL/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nolane-proofline-ledger-runtime.log"
          exit 1
      - name: Capture Proofline ledger evidence
        shell: bash
        run: |
          export NOLANE_UI_LEDGER_OUTPUT="$RUNNER_TEMP/nolane-proofline-ledger-evidence"
          node scripts/capture-proofline-ledger-evidence.mjs
      - name: Upload Proofline ledger evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: proofline-ledger-runtime-evidence
          path: ${{ runner.temp }}/nolane-proofline-ledger-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Stop source runtime
        if: always()
        shell: bash
        run: |
          if [ -n "${NOLANE_PROOFLINE_LEDGER_PID:-}" ]; then
            kill "$NOLANE_PROOFLINE_LEDGER_PID" || true
          fi
