name: Product Perfection Settings Contrast Fix
on:
  push:
    branches: [codex/product-perfection-system-v3]
    paths: ['.github/workflows/product-perfection-settings-contrast-fix.yml']
permissions:
  contents: write
jobs:
  contrast-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Prove RED
        shell: bash
        run: |
          if node --test tests/ui-v3-settings-primary-contrast.test.mjs; then
            echo 'contrast contract unexpectedly green before migration' >&2; exit 1
          fi
      - name: Apply bounded contrast correction
        run: node scripts/apply-settings-primary-contrast-fix.mjs
      - name: Verify GREEN and canonical distribution
        shell: bash
        run: |
          node --test tests/ui-v3-settings-primary-contrast.test.mjs tests/ui-v3-settings-controller.test.mjs tests/ui-v3-settings-route.test.mjs tests/ui-v3-accessibility.test.mjs
          npm run validate:ui-tokens
          npm run audit:ui-quality
          npm run build:ui-v3
          git diff --check
      - name: Commit exact repair
        shell: bash
        run: |
          git rm -f .github/workflows/product-perfection-settings-contrast-fix.yml scripts/apply-settings-primary-contrast-fix.mjs
          git add ui-v3/styles/pages/settings.css ui-dist tests/ui-v3-settings-primary-contrast.test.mjs
          git config user.name nolane-ui-bot
          git config user.email actions@users.noreply.github.com
          git commit -m 'fix(ui): restore contrast-safe Settings primary foreground'
          node --test tests/ui-v3-settings-primary-contrast.test.mjs
          test -z "$(git status --porcelain)"
          git push origin HEAD:codex/product-perfection-system-v3
