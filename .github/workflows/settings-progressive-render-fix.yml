name: Settings progressive rendering fix

on:
  pull_request:
    types: [reopened]
    paths:
      - '.github/workflows/settings-progressive-render-fix.yml'
      - 'ui-v3/views/settings/settings-view.mjs'
      - 'tests/ui-v3-settings-controller.test.mjs'

permissions:
  contents: write

jobs:
  apply-settings-render-fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/ui-performance-runtime-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply bounded progressive-render patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'ui-v3/views/settings/settings-view.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              "const categories=state.visibleCategories??[];const exp=normalizeExperience(state.experience);",
              "const categories=state.visibleCategories??[];const searching=Boolean(String(state.query??'').trim());const activeCategory=categories.find(item=>item.id===state.activeCategory)??categories[0]??null;const contentCategories=searching?categories:activeCategory?[activeCategory]:[];const exp=normalizeExperience(state.experience);"
            ],
            [
              "item.id===state.activeCategory?' aria-current=\"true\"':''",
              "item.id===activeCategory?.id?' aria-current=\"true\"':''"
            ],
            [
              "${categories.map(item=>renderCategory(item,state,lang)).join('')||",
              "${contentCategories.map(item=>renderCategory(item,state,lang)).join('')||"
            ]
          ];
          for (const [before, after] of replacements) {
            const matches = source.split(before).length - 1;
            if (matches !== 1) throw new Error(`Expected exactly one match for ${before.slice(0, 80)}, found ${matches}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE

      - name: Prove focused Settings behavior
        run: node --test tests/ui-v3-settings-controller.test.mjs

      - name: Build deterministic UI distribution
        run: npm run build:ui-v3

      - name: Prove patch scope
        shell: bash
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(ui-v3/views/settings/settings-view\.mjs|ui-dist/)' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' 'Unexpected changes:' "$unexpected" >&2
            exit 1
          fi
          test -n "$(git status --porcelain -- ui-v3/views/settings/settings-view.mjs)" || { echo 'Settings source did not change' >&2; exit 1; }
          test -n "$(git status --porcelain -- ui-dist)" || { echo 'Generated ui-dist did not change' >&2; exit 1; }

      - name: Commit source and generated distribution
        shell: bash
        run: |
          git config user.name 'nolane-ci'
          git config user.email 'nolane-ci@users.noreply.github.com'
          git add ui-v3/views/settings/settings-view.mjs ui-dist
          git commit -m 'perf(ui): progressively render Settings categories'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
