name: Product Perfection Task 6 Review Diagnostics

on:
  push:
    branches:
      - codex/product-perfection-system-v3
    paths:
      - '.github/workflows/product-perfection-task6-review-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOLANE_AGENT_HOST: 127.0.0.1
      NOLANE_AGENT_PORT: 4173
      NOLANE_AGENT_TOKEN: nolane-task6-review-diagnostics-token
      NOLANE_UI_RUNTIME_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify canonical distribution
        run: |
          npm run build:ui-v3
          git diff --exit-code -- ui-dist
      - name: Install Chromium + Axe
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2 @axe-core/playwright@4.12.1
          npx playwright install --with-deps chromium
      - name: Start source runtime
        shell: bash
        env:
          NOLANE_AGENT_DATA_DIR: ${{ runner.temp }}/nolane-task6-review-diagnostics-data
        run: |
          node src/app.mjs > "$RUNNER_TEMP/nolane-task6-review-diagnostics.log" 2>&1 &
          echo "NOLANE_REVIEW_DIAG_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$NOLANE_UI_RUNTIME_URL/health" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nolane-task6-review-diagnostics.log"
          exit 1
      - name: Complete onboarding
        shell: bash
        env:
          NOLANE_UI_VISUAL_OUTPUT: ${{ runner.temp }}/review-diagnostics/onboarding
          NOLANE_UI_VISUAL_STATES: onboarding
        run: node scripts/capture-ui-runtime-visual.mjs
      - name: Diagnose Review Axe nodes
        shell: bash
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/node_modules" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/review-diagnostics"
          cat > "$RUNNER_TEMP/review-diagnostics.mjs" <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import AxeBuilder from '@axe-core/playwright';
          import { chromium } from 'playwright';
          const base=process.env.NOLANE_UI_RUNTIME_URL;
          const token=process.env.NOLANE_AGENT_TOKEN;
          const out=`${process.env.RUNNER_TEMP}/review-diagnostics`;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000}});
          const page=await context.newPage();
          try {
            await page.goto(`${base}/#/missions?token=${encodeURIComponent(token)}`,{waitUntil:'domcontentloaded'});
            await page.locator('.activity-page').waitFor({state:'visible',timeout:30000});
            const fixture=await page.evaluate(async ({workspaceRoot})=>{
              const request=async(path,{method='GET',body=null}={})=>{
                const r=await fetch(path,{method,headers:body==null?undefined:{'content-type':'application/json'},body:body==null?undefined:JSON.stringify(body)});
                const t=await r.text(); let p=null; try{p=t?JSON.parse(t):null}catch{p=t}
                if(!r.ok) throw new Error(`${method} ${path} ${r.status}: ${typeof p==='string'?p:JSON.stringify(p)}`);
                return p;
              };
              const project=await request('/api/projects',{method:'POST',body:{name:'Task 6 Review Contrast Diagnostic',workspaceRoot,metadata:{evidenceFixture:'task6-review-contrast-v1'}}});
              const mission=await request('/api/missions/plan',{method:'POST',body:{projectId:project.id,objective:'Diagnose the Review evidence surface contrast',plan:{summary:'Create a bounded review diagnostic fixture.',tasks:[{id:'review',title:'Inspect review truth',objective:'Inspect exact Review rendering.',role:'reviewer',dependencies:[],allowedPaths:['**'],deniedPaths:['.env','.env.*']}]}}});
              const review=await request(`/api/agent/runs/${encodeURIComponent(mission.id)}/diff-review`);
              return {missionId:mission.id,reviewSha256:review.reviewSha256};
            },{workspaceRoot:process.cwd()});
            await page.evaluate(({missionId})=>{location.hash=`/review/${encodeURIComponent(missionId)}`;},fixture);
            await page.locator('.review-detail').waitFor({state:'visible',timeout:20000});
            await page.waitForTimeout(250);
            const axe=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']).analyze();
            const blocking=axe.violations.filter(v=>['serious','critical'].includes(String(v.impact))).map(v=>({
              id:v.id,impact:v.impact,help:v.help,helpUrl:v.helpUrl,
              nodes:v.nodes.map(n=>({target:n.target,html:n.html,failureSummary:n.failureSummary,any:n.any,all:n.all,none:n.none}))
            }));
            const details=[];
            for(const violation of blocking){
              for(const node of violation.nodes){
                for(const target of node.target){
                  const computed=await page.locator(target).first().evaluate(el=>{
                    const s=getComputedStyle(el); const r=el.getBoundingClientRect();
                    return {tag:el.tagName,className:el.className,text:el.textContent?.trim(),color:s.color,backgroundColor:s.backgroundColor,fontSize:s.fontSize,fontWeight:s.fontWeight,opacity:s.opacity,rect:{x:r.x,y:r.y,width:r.width,height:r.height}};
                  }).catch(error=>({selectorError:String(error)}));
                  details.push({violationId:violation.id,target,computed});
                }
              }
            }
            const report={schema:'nolane.task6.review-contrast-diagnostic.v1',sourceRevision:process.env.GITHUB_SHA,fixture,blocking,details};
            await writeFile(`${out}/axe-review-1440.json`,`${JSON.stringify(report,null,2)}\n`);
            await page.screenshot({path:`${out}/review-1440.png`,fullPage:true,animations:'disabled'});
            console.log(JSON.stringify(report,null,2));
            if(blocking.length) process.exitCode=2;
          } finally { await context.close(); await browser.close(); }
          NODE
          node "$RUNNER_TEMP/review-diagnostics.mjs"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: task6-review-contrast-diagnostics
          path: ${{ runner.temp }}/review-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [ -n "${NOLANE_REVIEW_DIAG_PID:-}" ]; then kill "$NOLANE_REVIEW_DIAG_PID" || true; fi
