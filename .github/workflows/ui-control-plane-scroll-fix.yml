name: UI Control Plane scroll-region fix

on:
  push:
    branches:
      - codex/ui-runtime-certification-evidence
    paths:
      - '.github/workflows/ui-control-plane-scroll-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.ref == 'refs/heads/codex/ui-runtime-certification-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply exact route-table accessibility repair
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const file = 'ui-v3/control-plane/live-domain-workspace.mjs';
          let source = await readFile(file, 'utf8');
          const from = '<div class="cp-route-table-wrap"><table>';
          const to = '<div class="cp-route-table-wrap" role="region" tabindex="0" aria-label="${escapeHtml(t.routesExposed)}"><table>';
          const count = source.split(from).length - 1;
          if (count !== 1) throw new Error(`Expected exactly one route-table wrapper, got ${count}`);
          source = source.replace(from, to);
          await writeFile(file, source);
          NODE
      - name: Prove focused accessibility regressions
        run: node --test tests/ui-v3-control-plane-scroll-region.test.mjs tests/ui-v3-settings-contrast.test.mjs tests/ui-v3-skills-contrast.test.mjs
      - name: Build deterministic UI distribution
        run: npm run build:ui-v3
      - name: Commit source and generated distribution atomically
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v3/control-plane/live-domain-workspace.mjs ui-dist
          git diff --cached --exit-code && { echo 'Expected Control Plane accessibility changes were not produced'; exit 1; }
          git commit -m 'fix(ui): make Control Plane route table keyboard scrollable'
          git push origin HEAD:codex/ui-runtime-certification-evidence
